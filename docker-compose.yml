services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "${HOST_PORT:-5173}:${HOST_PORT:-5173}"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      # "localhost" inside the container is the container; reach myPay on the host instead.
      - API_PROXY_TARGET=${API_PROXY_TARGET:-http://host.docker.internal:8000}
    command: npm run dev -- --host 0.0.0.0

  web-prod:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    profiles:
      - prod
