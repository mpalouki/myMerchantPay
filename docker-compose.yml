services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "${HOST_PORT:-5173}:${HOST_PORT:-5173}"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0

  web-prod:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    profiles:
      - prod
